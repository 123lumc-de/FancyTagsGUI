name: Build FancyTagsGUI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 25 installieren (Temurin Distribution)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 3. Maven Build mit Shade-Plugin
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      # 4. Fertige JAR als Artifact hochladen
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FancyTagsGUI-JAR
          path: target/*.jar
          if-no-files-found: error

      # 5. (Optional) Automatisches Release bei Tag-Push (z.B. v1.0.0)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
